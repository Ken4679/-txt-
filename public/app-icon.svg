<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Background Subtle Grid Accent -->
  <path d="M128 0v512M256 0v512M384 0v512M0 128h512M0 256h512M0 384h512" stroke="#1e293b" stroke-width="2" stroke-opacity="0.4" />

  <!-- Code Bracket Left -->
  <path d="M156 180 L88 256 L156 332" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Code Bracket Right -->
  <path d="M356 180 L424 256 L356 332" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Central Archive Document / Code Core Block -->
  <rect x="180" y="140" width="152" height="232" rx="24" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="12" />

  <!-- Archive Zipper Teeth -->
  <path d="M256 140 v150" stroke="#64748b" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round" />
  
  <!-- AI Sparkle / Zipper Slider Node -->
  <circle cx="256" cy="270" r="26" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="256" cy="270" r="12" fill="#ffffff" />

  <!-- AI Synaptic Laser Beams -->
  <path d="M256 270 L190 200 M256 270 L322 200 M256 270 L200 330 M256 270 L312 330" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Document Line Accents -->
  <line x1="208" y1="180" x2="236" y2="180" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  <line x1="276" y1="180" x2="304" y2="180" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  <line x1="208" y1="340" x2="304" y2="340" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
</svg>
