name: Build and Release Windows EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile main.py core.py

      - name: Security smoke tests
        shell: pwsh
        run: |
          python test_core.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name "ZipToTxt" `
            --icon="app.ico" `
            --add-data "app.ico;." `
            --add-data "app_icon.png;." `
            main.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ZipToTxt.exe")) { throw "EXE build failed." }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipToTxt-Windows
          path: dist/ZipToTxt.exe

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ZipToTxt-Windows
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZipToTxt.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
